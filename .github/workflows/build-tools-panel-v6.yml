name: Build approved tools panel Debug APK v6
on:
  push:
    branches: ['codex/build-tools-panel-v6-cebb1ed5']
    paths: ['.github/workflows/build-tools-panel-v6.yml']
permissions:
  contents: read
jobs:
  build:
    if: github.event.before == 'cebb1ed5d0183840dfa71a146d2da209e655f568'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      apk_sha256: ${{ steps.verify.outputs.sha256 }}
    env:
      APK_FILE: app/build/outputs/apk/debug/HeliBoard_4.3-beta1-v6-debug.apk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'cebb1ed5d0183840dfa71a146d2da209e655f568'
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble approved Debug APK
        run: ./gradlew :app:assembleDebug
      - name: Verify APK metadata, signature, and toolbar resources
        id: verify
        shell: bash
        run: |
          test -s "$APK_FILE"
          unzip -tq "$APK_FILE"
          sdk_tools="$(dirname "$(find "$ANDROID_HOME/build-tools" -name apksigner -print | sort -V | tail -n 1)")"
          "$sdk_tools/zipalign" -c 4 "$APK_FILE"
          "$sdk_tools/apksigner" verify --verbose --print-certs "$APK_FILE"
          badging="$("$sdk_tools/aapt2" dump badging "$APK_FILE")"
          printf '%s\n' "$badging" | awk '/^package:|^sdkVersion:|^targetSdkVersion:|^native-code:|^uses-permission:/'
          [[ "$badging" == *"name='helium314.keyboard.debug' versionCode='4304' versionName='4.3-beta1-v6'"* ]]
          [[ "$badging" != *"android.permission.INTERNET"* ]]
          "$sdk_tools/aapt2" dump resources "$APK_FILE" | awk '
            /string\/toolbar_more_options/ { menu = 1 }
            /string\/toolbar_edit_pinned/ { pinned = 1 }
            /string\/toolbar_dock_keyboard/ { dock = 1 }
            /id\/toolbar_tools_panel/ { panel = 1 }
            /drawable\/ic_toolbar_grid/ { grid = 1 }
            /drawable\/ic_toolbar_edit/ { edit = 1 }
            /string\/toolbar_lock_position/ { lock = 1 }
            /string\/toolbar_unlock_position/ { unlock = 1 }
            END { if (menu && pinned && dock && panel && grid && edit && lock && unlock) print "Tools panel resources verified"; else exit 1 }'
          unzip -p "$APK_FILE" assets/layouts/main/urdu.json | cmp app/src/main/assets/layouts/main/urdu.json -
          stat -c 'APK bytes: %s' "$APK_FILE"
          sha256sum "$APK_FILE"
          printf 'sha256=%s\n' "$(sha256sum "$APK_FILE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: MeraAiKeyboard-v6-debug
          path: app/build/outputs/apk/debug/HeliBoard_4.3-beta1-v6-debug.apk
          if-no-files-found: error
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MeraAiKeyboard-v6-debug
          path: ${{ runner.temp }}/tools-panel-v6
      - name: Match the verified APK
        env:
          APK_SHA: ${{ needs.build.outputs.apk_sha256 }}
        working-directory: ${{ runner.temp }}/tools-panel-v6
        run: printf '%s  HeliBoard_4.3-beta1-v6-debug.apk\n' "$APK_SHA" | sha256sum -c -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install the verified APK and check IME registration
        shell: bash
        run: |
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avds"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          accel=()
          if [[ -c /dev/kvm && ( ! -r /dev/kvm || ! -w /dev/kvm ) ]]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod u+rw /dev/kvm
          fi
          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo 'KVM unavailable, attempting software emulation.'
            accel=(-accel off)
          fi
          image='system-images;android-30;default;x86_64'
          timeout 240s sdkmanager --install emulator "$image"
          avd_name='tools_v6_install'
          avd_path="$ANDROID_AVD_HOME/$avd_name.avd"
          printf 'no\n' | timeout 45s avdmanager create avd --force --name "$avd_name" --package "$image" --device pixel --path "$avd_path"
          test -s "$avd_path/config.ini"
          test -s "$ANDROID_AVD_HOME/$avd_name.ini"
          emulator="$ANDROID_HOME/emulator/emulator"
          "$emulator" -list-avds | grep -Fx "$avd_name"
          emu_log="$(mktemp)"
          "$emulator" -avd "$avd_name" -port 5554 -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect "${accel[@]}" > "$emu_log" 2>&1 &
          emu_pid=$!
          trap 'timeout 5s adb -s emulator-5554 emu kill >/dev/null 2>&1 || kill "$emu_pid" 2>/dev/null || true' EXIT
          deadline=$((SECONDS + 180))
          booted=0
          while (( SECONDS < deadline )) && kill -0 "$emu_pid" 2>/dev/null; do
            if [[ "$(timeout 5s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              booted=1
              break
            fi
            sleep 3
          done
          if [[ "$booted" != 1 ]]; then
            tail -n 40 "$emu_log"
            exit 1
          fi
          timeout 90s adb -s emulator-5554 install -t "$RUNNER_TEMP/tools-panel-v6/HeliBoard_4.3-beta1-v6-debug.apk"
          timeout 20s adb -s emulator-5554 shell pm path helium314.keyboard.debug
          echo 'APK_EMULATOR_INSTALL=passed (Android API 30)'
          ime_id=''
          for attempt in {1..15}; do
            available="$(timeout 10s adb -s emulator-5554 shell ime list -a -s | tr -d '\r')"
            ime_id="$(printf '%s\n' "$available" | awk '/^helium314[.]keyboard[.]debug\// { print; exit }')"
            if [[ -n "$ime_id" ]]; then break; fi
            sleep 2
          done
          printf 'Available input methods:\n%s\n' "$available"
          if [[ -z "$ime_id" ]]; then
            timeout 20s adb -s emulator-5554 shell cmd package query-services --brief -a android.view.InputMethod -p helium314.keyboard.debug || true
            timeout 15s adb -s emulator-5554 logcat -d -s InputMethodManagerService PackageManager | tail -n 50 || true
            exit 1
          fi
          timeout 20s adb -s emulator-5554 shell ime enable "$ime_id"
          timeout 20s adb -s emulator-5554 shell ime set "$ime_id"
          selected="$(timeout 15s adb -s emulator-5554 shell settings get secure default_input_method | tr -d '\r')"
          [[ "$selected" == "$ime_id" ]]
          printf 'IME_SELECTED=%s\n' "$ime_id"
          mkdir -p "$RUNNER_TEMP/v6-ui"
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import time
          from pathlib import Path
          from xml.etree import ElementTree

          output = Path(os.environ["RUNNER_TEMP"]) / "v6-ui"

          def adb(*args, timeout=20):
              return subprocess.check_output(["adb", "-s", "emulator-5554", *args], timeout=timeout)

          def bounds(node):
              match = re.fullmatch(r"\[(\d+),(\d+)]\[(\d+),(\d+)]", node.get("bounds", ""))
              return tuple(map(int, match.groups())) if match else None

          def snapshot(name):
              adb("shell", "uiautomator", "dump", "/data/local/tmp/v6-view.xml")
              xml = adb("exec-out", "cat", "/data/local/tmp/v6-view.xml")
              (output / f"{name}.xml").write_bytes(xml)
              (output / f"{name}.png").write_bytes(adb("exec-out", "screencap", "-p"))
              return tuple(ElementTree.fromstring(xml).iter("node"))

          def find(nodes, predicate):
              return next((node for node in nodes if bounds(node) and predicate(node)), None)

          def by_id(nodes, name):
              return find(nodes, lambda node: node.get("resource-id", "").endswith(":id/" + name))

          def tap(node):
              left, top, right, bottom = bounds(node)
              adb("shell", "input", "tap", str((left+right)//2), str((top+bottom)//2))
              time.sleep(1)

          class ProbeUnavailable(Exception):
              pass

          def probe():
              adb("shell", "am", "start", "-W", "-a", "android.settings.SETTINGS")
              initial = snapshot("settings")
              search = by_id(initial, "search_action_bar") or find(initial, lambda node:
                  "search settings" in (node.get("text", "") + node.get("content-desc", "")).lower())
              if search is None:
                  raise ProbeUnavailable("Android Settings search was not exposed")
              tap(search)
              search_screen = snapshot("search")
              field = find(search_screen, lambda node: node.get("class") == "android.widget.EditText")
              if field is not None:
                  tap(field)
              normal = snapshot("keyboard")
              menu = by_id(normal, "suggestions_strip_tools_menu") or find(normal, lambda node:
                  node.get("content-desc") == "Open keyboard tools")
              key_view = by_id(normal, "keyboard_view")
              if menu is None or key_view is None:
                  raise ProbeUnavailable("the accessibility dump did not expose the input-method window")
              normal_bottom = bounds(key_view)[3]
              tap(menu)
              browser = snapshot("tools")
              panel = by_id(browser, "toolbar_tools_panel")
              pencil = find(browser, lambda node: node.get("content-desc") == "Edit keyboard tools")
              if panel is None or pencil is None:
                  raise ProbeUnavailable("the accessibility dump did not expose the panel bounds")
              top, bottom = bounds(panel)[1::2]
              pencil_top, pencil_bottom = bounds(pencil)[1::2]
              assert top <= pencil_top < pencil_bottom <= bottom < normal_bottom, (
                  top, pencil_top, pencil_bottom, bottom, normal_bottom)
              tap(pencil)
              editor = by_id(snapshot("editor"), "toolbar_tools_panel")
              if editor is None:
                  raise ProbeUnavailable("the accessibility dump did not expose the editor bounds")
              assert bounds(editor)[3] == bottom, (bounds(editor), bottom)
              print(f"PANEL_SMOKE=passed; clearance={normal_bottom-bottom}px; editor within same bounds")

          try:
              probe()
          except (ProbeUnavailable, subprocess.SubprocessError, ElementTree.ParseError) as error:
              print(f"PANEL_SMOKE=unavailable; {error}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyboard-v6-emulator-layout
          path: ${{ runner.temp }}/v6-ui
          if-no-files-found: ignore
